<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Financial Analytics Dashboard</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var m = localStorage.getItem('ledger-mode');
        // Night mode is the default; day mode applies only if the user picked it.
        if (m !== 'light' && m !== 'dark') m = 'dark';
        document.documentElement.style.backgroundColor = m === 'dark' ? '#131512' : '#F6F4EF';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
