# Keeps the Render free-tier API warm. GitHub's cron scheduler delays jobs on
# low-traffic repos (a bare */5 schedule was observed skipping for hours), so
# instead of relying on cron timing we run a *persistent runner*: each job
# pings every 4 minutes for ~6 hours, and overlapping schedules restart it
# twice a day (plus a mid-cycle top-up) so a runner is always alive.
name: Keep API warm

on:
  schedule:
    # Primary restarts every 6 hours. Top-ups at :30 cover GitHub's delays.
    - cron: '0 0,6,12,18 * * *'
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: keep-api-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Ping health endpoint every 4 minutes
        run: |
          # 88 rounds x 4 min = ~352 min, inside the 6-hour runner cap.
          for i in $(seq 1 88); do
            curl -fsS --max-time 60 \
              https://financial-dashboard-api-6hm2.onrender.com/health \
              || echo "ping $i failed (will retry next round)"
            sleep 240
          done
