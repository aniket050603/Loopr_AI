services:
  # Backend API (Express + TypeScript + MongoDB)
  - type: web
    name: financial-dashboard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false      # paste your Atlas SRV string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false      # your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: PORT
        value: 10000

  # Frontend (Vite build output) can be deployed from the same repo:
  #   Render → New → Static Site → root directory: frontend
  #   Build command: npm ci && npm run build   |   Publish directory: dist
  # (Recommended: use Vercel for the frontend instead — see README.)
